name: CI sécurisée

on: [push, pull_request]

jobs:
  build-test:
    # Compile et lance les tests unitaires à chaque push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B verify

  secrets:
    # Détection de secrets (clés, tokens) dans tout l'historique Git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    # Analyse statique du code : échoue si SpotBugs trouve un bug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B compile com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check -Dspotbugs.excludeFilterFile=spotbugs-exclude.xml

  sca:
    # Analyse des dépendances : bloque si une CVE a un score CVSS >= 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Restaurer la base NVD (cache)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: Dependency-Check
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DnvdApiKey=${{ secrets.NVD_API_KEY }}
      - name: Sauvegarder la base NVD (cache), même si le job échoue
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-sca
          path: target/dependency-check-report.html

  dast:
    # DAST : lance l'application puis la scanne avec OWASP ZAP (mode baseline, passif)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Construire et démarrer l'application
        run: |
          mvn -B package -DskipTests
          export JWT_SECRET=$(openssl rand -base64 48)
          export DEMO_PASSWORD=$(openssl rand -hex 12)
          nohup java -jar $(ls target/*.jar | grep -v original | head -1) > app.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:8080/auth/login && break; sleep 2; done
          curl -s -o /dev/null localhost:8080/auth/login || { echo "Application non démarrée :"; grep -E "Caused by|Description|Could not resolve" app.log | head; exit 1; }
      - name: Scan ZAP baseline
        # Mode baseline (passif). -I : les avertissements (WARN) ne font pas échouer le job
        run: |
          docker run --rm --network=host -u root -v "$PWD":/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8080 -r rapport-zap.html -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-zap
          path: rapport-zap.html
      - name: Log de l'application
        if: always()
        run: cat app.log | tail -30
