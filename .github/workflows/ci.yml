name: CI sécurisée

on: [push, pull_request]

jobs:
  build-test:
    # Compile le projet et lance les tests unitaires à chaque push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B verify
